[package]
name = "rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
mercuryrustlib = { path = "../../libs/rust" }
mercurylib = { path = "../../../lib" }
tokio = { version = "1.27.0", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
uuid = { version = "1.3.1", features = ["v4", "serde"] }
sha2 = "0.10.8"
hex = "0.4.3"
bitcoin = { version = "0.30.1", features = ["serde", "base64", "rand-std", "std"], default-features = false }
reqwest = { version = "0.11.16", features = ["json"] }
secp256k1 = { git = "https://github.com/w0xlt/rust-secp256k1.git", branch = "mercury-blinded-musig-port", features = [ "rand-std", "bitcoin_hashes", "std" ] }
sqlx = { version = "0.8.1", features = [ "runtime-tokio", "postgres", "tls-rustls" ] }

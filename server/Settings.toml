network = "regtest"
batch_timeout = 120 # seconds
db_user = "postgres"
db_password = "postgres"
db_host = "localhost"
db_port = 5432
db_name = "mercury"
token_server_url = "http://localhost:8001" # URL of the token server (optional)

[[enclaves]]
url = "http://127.0.0.1:18080"
allow_deposit = true

# For local regtest only. Every transport also requires a 64-hex
# LOCKBOX_AUTH_TOKEN environment variable.
# env var: ENCLAVES='[{"url":"http://127.0.0.1:18080","allow_deposit":true}]'

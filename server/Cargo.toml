[package]
name = "mercury-server"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitcoin = { git = "https://github.com/w0xlt/rust-bitcoin", branch = "inquisition-bip448-support-0.30.2", version = "0.30.2", features = ["serde", "base64", "rand-std", "std"], default-features = false }
config = "0.13.1"
reqwest = { version = "0.11.16", features = ["blocking", "json", "socks"] }
rocket = { version = "0.5.0", features = ["json"] }
sqlx = { version = "0.8.1", features = [ "runtime-tokio", "postgres", "time", "uuid", "chrono", "tls-rustls" ] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
uuid = { version = "1.3.1", features = ["v4", "serde"] }
rand = "0.8.5"
hex = "0.4.3"
secp256k1 = { git = "https://github.com/w0xlt/rust-secp256k1.git", branch = "mercury-blinded-musig-port", features = [ "rand-std", "bitcoin_hashes", "std" ] }
# secp256k1 = { path = "../ss-rust-secp256k1", features = [ "rand-std", "bitcoin_hashes", "std" ] }
mercurylib = { path = "../lib" }
chrono = "0.4.31"
sha2 = "0.10.8"
log = "0.4.22"
env_logger = "0.11.5"
anyhow = "1.0"
enclavia = "0.2.0"

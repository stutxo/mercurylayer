openapi: 3.0.3
info:
  title: Mercury Layer BIP448 prototype API
  version: 0.2.1
  description: |
    This contract describes the functional Rocket routes mounted by the
    Mercury server and token server in this repository.

    Prototype boundaries:
    - Exact legacy duplicate-deposit behavior is not reproduced; another
      payment to one BIP448 deposit address does not become another wallet coin.
    - No chain watcher or automatic stale-state source selection is implemented.
    - The stale-state end-to-end proof is manually orchestrated by test code.
    - BIP448 consensus execution requires the repository-pinned Bitcoin
      Inquisition environment.
    - The repository makes no Bitcoin mainnet or production-use claim.
    - Fresh Mercury and lockbox databases and a fresh client wallet database
      are required; old data is not migrated.
    - Passing tests establish only the assertions and paths they execute.
servers:
  - url: http://127.0.0.1:8000
    description: Mercury Rocket service
tags:
  - name: Deposit
  - name: BIP448 signing
  - name: Transfer
  - name: Latch
  - name: Withdrawal
  - name: Info
  - name: Token
paths:
  /deposit/get_token:
    get:
      tags: [Deposit]
      summary: Create a Mercury deposit token
      responses:
        '200':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '500':
          $ref: '#/components/responses/MessageError'

  /deposit/init/pod:
    post:
      tags: [Deposit]
      summary: Initialize a lockbox-backed statechain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositMsg1'
      responses:
        '200':
          description: Statechain initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositMsg1Response'
        '400':
          $ref: '#/components/responses/MessageError'
        '404':
          $ref: '#/components/responses/MessageError'
        '410':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /bip448-statechain/sign/first:
    post:
      tags: [BIP448 signing]
      summary: Begin an idempotent blinded BIP448 signing round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bip448SignFirstRequest'
      responses:
        '200':
          description: Server public nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bip448SignFirstResponse'
        '400':
          $ref: '#/components/responses/MessageError'
        '401':
          $ref: '#/components/responses/MessageError'
        '404':
          $ref: '#/components/responses/MessageError'
        '409':
          $ref: '#/components/responses/MessageError'
        '422':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /bip448-statechain/sign/second:
    post:
      tags: [BIP448 signing]
      summary: Complete or exactly replay a blinded BIP448 signing round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bip448SignSecondRequest'
      responses:
        '200':
          description: Server partial signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bip448SignSecondResponse'
        '400':
          $ref: '#/components/responses/MessageError'
        '401':
          $ref: '#/components/responses/MessageError'
        '404':
          $ref: '#/components/responses/MessageError'
        '409':
          $ref: '#/components/responses/MessageError'
        '422':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /bip448-statechain/signature-count/{statechain_id}:
    get:
      tags: [BIP448 signing]
      summary: Read the lockbox BIP448 signature count
      parameters:
        - $ref: '#/components/parameters/StatechainId'
      responses:
        '200':
          description: Signature count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bip448SignatureCountResponse'
        '400':
          $ref: '#/components/responses/MessageError'
        '404':
          $ref: '#/components/responses/MessageError'
        '409':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/paymenthash/{batch_id}:
    get:
      tags: [Latch]
      summary: Read the payment hash for a stored batch preimage
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Payment hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHashResponse'
        '404':
          $ref: '#/components/responses/MessageError'

  /transfer/paymenthash:
    post:
      tags: [Latch]
      summary: Create and lock a batch preimage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentHashRequest'
      responses:
        '200':
          description: Payment hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHashResponse'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/transfer_preimage:
    post:
      tags: [Latch]
      summary: Retrieve an available transfer preimage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPreimageRequest'
      responses:
        '200':
          description: Preimage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPreimageResponse'
        '403':
          $ref: '#/components/responses/MessageError'
        '404':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/sender:
    post:
      tags: [Transfer]
      summary: Create server transfer state for a recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSenderRequest'
      responses:
        '200':
          description: Transfer secret share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSenderResponse'
        '400':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/update_msg:
    post:
      tags: [Transfer]
      summary: Store the encrypted transfer message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUpdateMsgRequest'
      responses:
        '200':
          description: Message updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedResponse'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/get_msg_addr/{new_auth_key}:
    get:
      tags: [Transfer]
      summary: Read encrypted messages for a recipient authentication key
      parameters:
        - name: new_auth_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encrypted messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMsgAddrResponse'
        '500':
          $ref: '#/components/responses/MessageError'

  /info/statechain/{statechain_id}:
    get:
      tags: [Info]
      summary: Read BIP448 signing rows and current server key data
      parameters:
        - $ref: '#/components/parameters/StatechainId'
      responses:
        '200':
          description: Statechain information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatechainInfoResponse'
        '404':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/unlock:
    post:
      tags: [Latch]
      summary: Unlock a transfer for the current owner or stored recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUnlockRequest'
      responses:
        '200':
          description: Transfer unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /transfer/receiver:
    post:
      tags: [Transfer]
      summary: Rotate the lockbox share to an authorized recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferReceiverRequest'
      responses:
        '200':
          description: Updated server public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceiverResponse'
        '400':
          description: Batch locked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceiverErrorResponse'
        '404':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

  /withdraw/complete:
    post:
      tags: [Withdrawal]
      summary: Delete server rows after a cooperative withdrawal broadcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawCompleteRequest'
      responses:
        '200':
          description: Statechain rows deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/MessageError'

  /info/config:
    get:
      tags: [Info]
      summary: Read the public batch timeout and package version
      responses:
        '200':
          description: Public server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoConfigResponse'

  /token/token_gen:
    servers:
      - url: http://127.0.0.1:8001
        description: Token Rocket service
    get:
      tags: [Token]
      summary: Create an on-chain token payment request
      responses:
        '200':
          description: Token payment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenGenResponse'
        '500':
          $ref: '#/components/responses/MessageError'

  /token/token_verify/{token_id}:
    servers:
      - url: http://127.0.0.1:8001
        description: Token Rocket service
    get:
      tags: [Token]
      summary: Check token payment confirmation and spent flags
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerifyResponse'
        '404':
          $ref: '#/components/responses/MessageError'
        '500':
          $ref: '#/components/responses/MessageError'

components:
  parameters:
    StatechainId:
      name: statechain_id
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string

  responses:
    MessageError:
      description: Request, upstream, or internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'

  schemas:
    TokenResponse:
      type: object
      required:
        - token_id
        - payment_method
        - deposit_address
        - fee
        - confirmation_target
      properties:
        token_id:
          type: string
        payment_method:
          type: string
        deposit_address:
          type: string
          nullable: true
        fee:
          type: integer
          format: int64
          minimum: 0
        confirmation_target:
          type: integer
          format: int64
          minimum: 0

    DepositMsg1:
      type: object
      required: [auth_key, token_id, signed_token_id]
      properties:
        auth_key:
          type: string
        token_id:
          type: string
        signed_token_id:
          type: string

    DepositMsg1Response:
      type: object
      required: [server_pubkey, statechain_id]
      properties:
        server_pubkey:
          type: string
        statechain_id:
          type: string

    Bip448SignFirstRequest:
      type: object
      required: [statechain_id, signed_statechain_id, signing_id]
      properties:
        statechain_id:
          type: string
        signed_statechain_id:
          type: string
        signing_id:
          type: string
          description: Opaque client-generated 32-byte hexadecimal identifier
          pattern: '^[0-9A-Fa-f]{64}$'

    Bip448SignFirstResponse:
      type: object
      required: [server_pubnonce]
      properties:
        server_pubnonce:
          type: string

    Bip448SignSecondRequest:
      type: object
      required:
        - statechain_id
        - signed_statechain_id
        - signing_id
        - negate_seckey
        - session
        - server_pub_nonce
      properties:
        statechain_id:
          type: string
        signed_statechain_id:
          type: string
        signing_id:
          type: string
          pattern: '^[0-9A-Fa-f]{64}$'
        negate_seckey:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        session:
          type: string
          description: Hexadecimal 133-byte blinded Mercury MuSig session
        server_pub_nonce:
          type: string

    Bip448SignSecondResponse:
      type: object
      required: [partial_sig]
      properties:
        partial_sig:
          type: string

    Bip448SignatureCountResponse:
      type: object
      required: [sig_count]
      properties:
        sig_count:
          type: integer
          format: int64
          minimum: 0

    PaymentHashRequest:
      type: object
      required: [statechain_id, auth_sig, batch_id]
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        batch_id:
          type: string

    PaymentHashResponse:
      type: object
      required: [hash]
      properties:
        hash:
          type: string

    TransferPreimageRequest:
      type: object
      required: [statechain_id, auth_sig, previous_user_auth_key, batch_id]
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        previous_user_auth_key:
          type: string
        batch_id:
          type: string

    TransferPreimageResponse:
      type: object
      required: [preimage]
      properties:
        preimage:
          type: string

    TransferSenderRequest:
      type: object
      required: [statechain_id, auth_sig, new_user_auth_key]
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        new_user_auth_key:
          type: string
        batch_id:
          type: string
          nullable: true

    TransferSenderResponse:
      type: object
      required: [x1]
      properties:
        x1:
          type: string

    TransferUpdateMsgRequest:
      type: object
      required: [statechain_id, auth_sig, new_user_auth_key, enc_transfer_msg]
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        new_user_auth_key:
          type: string
        enc_transfer_msg:
          type: string

    UpdatedResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean

    GetMsgAddrResponse:
      type: object
      required: [list_enc_transfer_msg]
      properties:
        list_enc_transfer_msg:
          type: array
          items:
            type: string

    StatechainInfoRow:
      type: object
      required: [statechain_id, server_pubnonce, challenge, tx_n]
      properties:
        statechain_id:
          type: string
        server_pubnonce:
          type: string
        challenge:
          type: string
        tx_n:
          type: integer
          format: int32
          minimum: 0

    StatechainInfoResponse:
      type: object
      required: [enclave_public_key, num_sigs, statechain_info, x1_pub]
      properties:
        enclave_public_key:
          type: string
        num_sigs:
          type: integer
          format: int32
          minimum: 0
        statechain_info:
          type: array
          items:
            $ref: '#/components/schemas/StatechainInfoRow'
        x1_pub:
          type: string
          nullable: true

    TransferUnlockRequest:
      type: object
      required: [statechain_id, auth_sig]
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        auth_pub_key:
          type: string
          nullable: true

    TransferReceiverRequest:
      type: object
      required: [statechain_id, t2, auth_sig]
      properties:
        statechain_id:
          type: string
        batch_data:
          type: string
          nullable: true
        t2:
          type: string
        auth_sig:
          type: string

    TransferReceiverResponse:
      type: object
      required: [server_pubkey]
      properties:
        server_pubkey:
          type: string

    TransferReceiverErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [StatecoinBatchLockedError, ExpiredBatchTimeError]
        message:
          type: string

    WithdrawCompleteRequest:
      type: object
      required: [statechain_id, signed_statechain_id]
      properties:
        statechain_id:
          type: string
        signed_statechain_id:
          type: string

    InfoConfigResponse:
      type: object
      required: [batchtimeout, version]
      properties:
        batchtimeout:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string

    TokenGenResponse:
      type: object
      required: [token_id, deposit_address, fee, confirmation_target]
      properties:
        token_id:
          type: string
        deposit_address:
          type: string
        fee:
          type: integer
          format: int64
          minimum: 0
        confirmation_target:
          type: integer
          format: int32
          minimum: 0

    TokenVerifyResponse:
      type: object
      required: [confirmed, spent]
      properties:
        confirmed:
          type: boolean
        spent:
          type: boolean

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

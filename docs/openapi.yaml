openapi: 3.0.0
info:
  title: Mercury Layer APIs
  version: 0.5.0
  description: Current Mercury server routes and token-server-v2 routes.
tags:
  - name: Mercury
    description: Mercury server API
  - name: token-server-v2
    description: Token payment API used by Mercury when TOKEN_SERVER_URL is configured
paths:
  /deposit/get_token:
    get:
      tags:
        - Mercury
      summary: Get a deposit token
      operationId: deposit_get_token
      description: Returns a free non-mainnet token when TOKEN_SERVER_URL is unset, or proxies token generation to token-server-v2 when configured.
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '500':
          $ref: '#/components/responses/Error'

  /deposit/init/pod:
    post:
      tags:
        - Mercury
      summary: Initialize a statechain deposit
      operationId: deposit_init_pod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositMsg1'
      responses:
        '200':
          description: Deposit initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositMsg1Response'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /sign/first:
    post:
      tags:
        - Mercury
      summary: Start the signing protocol
      operationId: sign_first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignFirstRequestPayload'
      responses:
        '200':
          description: Server public nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignFirstResponsePayload'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /sign/second:
    post:
      tags:
        - Mercury
      summary: Complete the signing protocol
      operationId: sign_second
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialSignatureRequestPayload'
      responses:
        '200':
          description: Server partial signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialSignatureResponsePayload'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /info/config:
    get:
      tags:
        - Mercury
      summary: Get Mercury server operating parameters
      operationId: info_config
      responses:
        '200':
          description: Mercury server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoConfigResponse'
        '500':
          $ref: '#/components/responses/Error'

  /info/keylist:
    get:
      tags:
        - Mercury
      summary: Get the current server public key share list
      operationId: info_keylist
      responses:
        '200':
          description: Key list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyListResponsePayload'
        '500':
          $ref: '#/components/responses/Error'

  /info/statechain/{statechain_id}:
    get:
      tags:
        - Mercury
      summary: Get current statechain information
      operationId: info_statechain
      parameters:
        - $ref: '#/components/parameters/StatechainId'
      responses:
        '200':
          description: Statechain information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatechainInfoResponsePayload'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/get_msg_addr/{new_auth_key}:
    get:
      tags:
        - Mercury
      summary: Get encrypted transfer messages for a recipient auth key
      operationId: transfer_get_msg_addr
      parameters:
        - name: new_auth_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encrypted transfer messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMsgAddrResponsePayload'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/sender:
    post:
      tags:
        - Mercury
      summary: Initialize a statechain transfer as sender
      operationId: transfer_sender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSenderRequestPayload'
      responses:
        '200':
          description: Transfer sender nonce material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSenderResponsePayload'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/update_msg:
    post:
      tags:
        - Mercury
      summary: Store encrypted transfer message
      operationId: transfer_update_msg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUpdateMsgRequestPayload'
      responses:
        '200':
          description: Transfer message update status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferUpdateMsgResponse'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/unlock:
    post:
      tags:
        - Mercury
      summary: Unlock a pending transfer
      operationId: transfer_unlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUnlockRequestPayload'
      responses:
        '200':
          description: Transfer unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/receiver:
    post:
      tags:
        - Mercury
      summary: Complete a statechain transfer as receiver
      operationId: transfer_receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferReceiverRequestPayload'
      responses:
        '200':
          description: Receiver transfer completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceiverPostResponsePayload'
        '400':
          description: Transfer batch validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceiverErrorResponsePayload'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/paymenthash/{batch_id}:
    get:
      tags:
        - Mercury
      summary: Get payment hash for a lightning latch batch
      operationId: transfer_get_paymenthash
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHashResponsePayload'
        '404':
          $ref: '#/components/responses/Error'

  /transfer/paymenthash:
    post:
      tags:
        - Mercury
      summary: Create payment hash for a lightning latch batch
      operationId: transfer_post_paymenthash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentHashRequestPayload'
      responses:
        '200':
          description: Payment hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHashResponsePayload'
        '500':
          $ref: '#/components/responses/Error'

  /transfer/transfer_preimage:
    post:
      tags:
        - Mercury
      summary: Retrieve a lightning latch transfer preimage
      operationId: transfer_preimage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPreimageRequestPayload'
      responses:
        '200':
          description: Transfer preimage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPreimageResponsePayload'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /withdraw/complete:
    post:
      tags:
        - Mercury
      summary: Complete withdrawal and delete statechain server state
      operationId: withdraw_complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawCompletePayload'
      responses:
        '200':
          description: Statechain deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/Error'

  /token/token_gen:
    get:
      tags:
        - token-server-v2
      summary: Generate an onchain paid token
      operationId: token_server_token_gen
      responses:
        '200':
          description: Token payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenServerTokenResponse'
        '500':
          $ref: '#/components/responses/Error'

  /token/token_verify/{token_id}:
    get:
      tags:
        - token-server-v2
      summary: Verify token payment status
      operationId: token_server_token_verify
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          description: Token status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenStatusResponse'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

components:
  parameters:
    StatechainId:
      name: statechain_id
      in: path
      required: true
      schema:
        type: string
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    TokenResponse:
      type: object
      required:
        - token_id
        - payment_method
        - deposit_address
        - fee
        - confirmation_target
      properties:
        token_id:
          type: string
        payment_method:
          type: string
          enum:
            - free
            - onchain
        deposit_address:
          type: string
          nullable: true
        fee:
          type: integer
          format: uint64
          minimum: 0
        confirmation_target:
          type: integer
          format: uint64
          minimum: 0

    TokenServerTokenResponse:
      type: object
      required:
        - token_id
        - deposit_address
        - fee
        - confirmation_target
      properties:
        token_id:
          type: string
        deposit_address:
          type: string
        fee:
          type: integer
          format: uint64
          minimum: 0
        confirmation_target:
          type: integer
          format: uint32
          minimum: 0

    TokenStatusResponse:
      type: object
      required:
        - confirmed
        - spent
      properties:
        confirmed:
          type: boolean
        spent:
          type: boolean

    DepositMsg1:
      type: object
      required:
        - auth_key
        - token_id
        - signed_token_id
      properties:
        auth_key:
          type: string
        token_id:
          type: string
        signed_token_id:
          type: string

    DepositMsg1Response:
      type: object
      required:
        - server_pubkey
        - statechain_id
      properties:
        server_pubkey:
          description: Server public key share
          type: string
        statechain_id:
          type: string

    SignFirstRequestPayload:
      type: object
      required:
        - statechain_id
        - signed_statechain_id
      properties:
        statechain_id:
          type: string
        signed_statechain_id:
          type: string

    SignFirstResponsePayload:
      type: object
      required:
        - server_pubnonce
      properties:
        server_pubnonce:
          type: string

    PartialSignatureRequestPayload:
      type: object
      required:
        - statechain_id
        - negate_seckey
        - session
        - signed_statechain_id
        - server_pub_nonce
      properties:
        statechain_id:
          type: string
        negate_seckey:
          type: integer
          format: uint8
          minimum: 0
        session:
          type: string
        signed_statechain_id:
          type: string
        server_pub_nonce:
          type: string

    PartialSignatureResponsePayload:
      type: object
      required:
        - partial_sig
      properties:
        partial_sig:
          type: string

    InfoConfigResponse:
      type: object
      required:
        - initlock
        - interval
        - batchtimeout
        - version
      properties:
        initlock:
          type: integer
          format: uint32
          minimum: 0
        interval:
          type: integer
          format: uint32
          minimum: 0
        batchtimeout:
          type: integer
          format: uint32
          minimum: 0
        version:
          type: string

    PubKeyInfo:
      type: object
      required:
        - server_pubkey
        - tx_n
        - created_at
      properties:
        server_pubkey:
          type: string
        tx_n:
          type: integer
          format: uint32
          minimum: 0
        created_at:
          type: string

    KeyListResponsePayload:
      type: object
      required:
        - list_keyinfo
      properties:
        list_keyinfo:
          type: array
          items:
            $ref: '#/components/schemas/PubKeyInfo'

    StatechainInfo:
      type: object
      required:
        - statechain_id
        - server_pubnonce
        - challenge
        - tx_n
      properties:
        statechain_id:
          type: string
        server_pubnonce:
          type: string
        challenge:
          type: string
        tx_n:
          type: integer
          format: uint32
          minimum: 0

    StatechainInfoResponsePayload:
      type: object
      required:
        - enclave_public_key
        - num_sigs
        - statechain_info
        - x1_pub
      properties:
        enclave_public_key:
          type: string
        num_sigs:
          type: integer
          format: uint32
          minimum: 0
        statechain_info:
          type: array
          items:
            $ref: '#/components/schemas/StatechainInfo'
        x1_pub:
          type: string
          nullable: true

    GetMsgAddrResponsePayload:
      type: object
      required:
        - list_enc_transfer_msg
      properties:
        list_enc_transfer_msg:
          type: array
          items:
            type: string

    TransferSenderRequestPayload:
      type: object
      required:
        - statechain_id
        - auth_sig
        - new_user_auth_key
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        new_user_auth_key:
          type: string
        batch_id:
          type: string
          nullable: true

    TransferSenderResponsePayload:
      type: object
      required:
        - x1
      properties:
        x1:
          type: string

    TransferUpdateMsgRequestPayload:
      type: object
      required:
        - statechain_id
        - auth_sig
        - new_user_auth_key
        - enc_transfer_msg
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        new_user_auth_key:
          type: string
        enc_transfer_msg:
          type: string

    TransferUpdateMsgResponse:
      type: object
      required:
        - updated
      properties:
        updated:
          type: boolean

    TransferUnlockRequestPayload:
      type: object
      required:
        - statechain_id
        - auth_sig
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        auth_pub_key:
          type: string
          nullable: true

    TransferReceiverRequestPayload:
      type: object
      required:
        - statechain_id
        - t2
        - auth_sig
      properties:
        statechain_id:
          type: string
        batch_data:
          type: string
          nullable: true
        t2:
          type: string
        auth_sig:
          type: string

    TransferReceiverPostResponsePayload:
      type: object
      required:
        - server_pubkey
      properties:
        server_pubkey:
          type: string

    TransferReceiverErrorResponsePayload:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - StatecoinBatchLockedError
            - ExpiredBatchTimeError
        message:
          type: string

    PaymentHashRequestPayload:
      type: object
      required:
        - statechain_id
        - auth_sig
        - batch_id
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        batch_id:
          type: string

    PaymentHashResponsePayload:
      type: object
      required:
        - hash
      properties:
        hash:
          type: string

    TransferPreimageRequestPayload:
      type: object
      required:
        - statechain_id
        - auth_sig
        - previous_user_auth_key
        - batch_id
      properties:
        statechain_id:
          type: string
        auth_sig:
          type: string
        previous_user_auth_key:
          type: string
        batch_id:
          type: string

    TransferPreimageResponsePayload:
      type: object
      required:
        - preimage
      properties:
        preimage:
          type: string

    WithdrawCompletePayload:
      type: object
      required:
        - statechain_id
        - signed_statechain_id
      properties:
        statechain_id:
          type: string
        signed_statechain_id:
          type: string

[package]
name = "token-server-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
config = "0.13.1"
reqwest = { version = "0.11.16", features = ["blocking", "json", "socks"] }
rocket = { version = "0.5.0-rc", features = ["json"] }
sqlx = { version = "0.8.1", features = [ "runtime-tokio", "postgres", "time", "uuid", "tls-rustls" ] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
uuid = { version = "1.3.1", features = ["v4", "serde"] }
anyhow = "1.0"
bitcoin = { git = "https://github.com/w0xlt/rust-bitcoin", branch = "inquisition-bip448-support-0.30.2", version = "0.30.2", features = ["serde", "base64", "rand-std", "std", "bitcoinconsensus"], default-features = false }

name: Integration Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: inquisition-core
            settings_file: regtest.core.Settings.toml
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      ML_SETTINGS_FILE: ${{ matrix.settings_file }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Build Rust tests
        run: |
          cargo test --workspace --locked --no-run

      - name: Start regtest stack
        run: |
          docker compose -f docker-compose-token-servers.yml up --build -d

      - name: Wait for Mercury server
        run: |
          timeout 180 bash -c 'until curl -sf http://127.0.0.1:8000/info/config >/dev/null; do sleep 2; done'

      - name: Wait for Inquisition node
        run: |
          container_id=$(docker ps -qf "name=mercurylayer-inquisition-1")
          timeout 180 bash -c 'until docker exec "'"$container_id"'" bitcoin-cli -regtest -rpcuser=mercury -rpcpassword=mercury getblockchaininfo >/dev/null; do sleep 2; done'

      - name: Initialize regtest wallet
        run: |
          container_id=$(docker ps -qf "name=mercurylayer-inquisition-1")
          echo "Container ID: $container_id"
          wallet_name="mercury_test"
          docker exec "$container_id" bitcoin-cli -regtest -rpcuser=mercury -rpcpassword=mercury createwallet "$wallet_name" || docker exec "$container_id" bitcoin-cli -regtest -rpcuser=mercury -rpcpassword=mercury loadwallet "$wallet_name"
          address=$(docker exec "$container_id" bitcoin-cli -regtest -rpcuser=mercury -rpcpassword=mercury -rpcwallet="$wallet_name" getnewaddress)
          echo "New Wallet Address: $address"
          docker exec "$container_id" bitcoin-cli -regtest -rpcuser=mercury -rpcpassword=mercury generatetoaddress 101 "$address"

      - name: Run retained integration suite
        run: |
          cd clients/tests/rust
          cargo test --test functional -- --ignored --test-threads=1

      - name: Run BIP448 primitive integration suite
        run: |
          cd clients/tests/rust
          cargo test --test bip448_primitive_spike -- --ignored --test-threads=1

      - name: Run BIP448 CSFS signing integration suite
        run: |
          cd clients/tests/rust
          cargo test --test bip448_csfs_signing -- --ignored --test-threads=1

      - name: Run lockbox compatibility suite
        run: |
          cd clients/tests/rust
          cargo test --test lockbox_compatibility -- --ignored --test-threads=1

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose-token-servers.yml down -v

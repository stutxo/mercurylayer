name: Integration Tests

on:
  push:
    branches:
      - dev
      - rebindable_statechains
      - feature/bip448-web-wallet-mutinynet
  pull_request:
    branches:
      - dev
      - rebindable_statechains

permissions:
  contents: read

jobs:
  web-wallet:
    name: BIP448 web wallet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-wallet/package-lock.json
      - name: Install browser test dependencies
        working-directory: web-wallet
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Rust/WASM wallet image
        run: docker build --file web-wallet/Dockerfile --build-arg WEB_WALLET_FEATURES=e2e-harness --tag mercury-bip448-web-wallet:e2e .
      - name: Exercise unilateral exit in Chromium
        working-directory: web-wallet
        run: npm run test:e2e

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      BIP448_CONTROLLER: ./target/debug/bip448-test
      BIP448_PRIMARY_PROJECT: b448-ci-${{ github.run_id }}-${{ github.run_attempt }}-primary
      BIP448_CONTROL_PROJECT: b448-ci-${{ github.run_id }}-${{ github.run_attempt }}-control
      BIP448_PRIMARY_BASE_PORT: "26000"
      BIP448_CONTROL_BASE_PORT: "26008"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Run Rust unit tests
        run: |
          cargo test --workspace --locked

      - name: Build BIP448 controller
        run: |
          cargo build --locked --package rust --bin bip448-test

      - name: Check BIP448 prerequisites
        run: |
          "$BIP448_CONTROLLER" doctor

      - name: Run authoritative BIP448 verification
        run: |
          "$BIP448_CONTROLLER" verify \
            --project "$BIP448_PRIMARY_PROJECT" \
            --base-port "$BIP448_PRIMARY_BASE_PORT" \
            --control-project "$BIP448_CONTROL_PROJECT" \
            --control-base-port "$BIP448_CONTROL_BASE_PORT"

      - name: Read primary BIP448 status
        if: always()
        run: |
          "$BIP448_CONTROLLER" status --project "$BIP448_PRIMARY_PROJECT"

      - name: Checkpoint primary BIP448 evidence
        if: always()
        run: |
          "$BIP448_CONTROLLER" checkpoint --project "$BIP448_PRIMARY_PROJECT"

      - name: Read primary BIP448 logs
        if: always()
        run: |
          "$BIP448_CONTROLLER" logs --project "$BIP448_PRIMARY_PROJECT"

      - name: Read control BIP448 status
        if: always()
        run: |
          "$BIP448_CONTROLLER" status --project "$BIP448_CONTROL_PROJECT"

      - name: Checkpoint control BIP448 evidence
        if: always()
        run: |
          "$BIP448_CONTROLLER" checkpoint --project "$BIP448_CONTROL_PROJECT"

      - name: Read control BIP448 logs
        if: always()
        run: |
          "$BIP448_CONTROLLER" logs --project "$BIP448_CONTROL_PROJECT"

      - name: Upload primary BIP448 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bip448-${{ github.run_id }}-${{ github.run_attempt }}-primary
          path: target/bip448-runs/${{ env.BIP448_PRIMARY_PROJECT }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload control BIP448 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bip448-${{ github.run_id }}-${{ github.run_attempt }}-control
          path: target/bip448-runs/${{ env.BIP448_CONTROL_PROJECT }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Tear down primary BIP448 project
        if: always()
        run: |
          "$BIP448_CONTROLLER" down --project "$BIP448_PRIMARY_PROJECT"

      - name: Tear down control BIP448 project
        if: always()
        run: |
          "$BIP448_CONTROLLER" down --project "$BIP448_CONTROL_PROJECT"

      - name: Prove primary BIP448 cleanup status
        if: always()
        run: |
          "$BIP448_CONTROLLER" status --project "$BIP448_PRIMARY_PROJECT"

      - name: Prove control BIP448 cleanup status
        if: always()
        run: |
          "$BIP448_CONTROLLER" status --project "$BIP448_CONTROL_PROJECT"

name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        -
          name: Checkout
          uses: actions/checkout@v4
        -
          name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: mercurylayer
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        -
          name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - 
          name: Get last commit hash
          id: get_commit_hash
          run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        -
          name: Build and push for mercury-server
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./server/Dockerfile
            push: true
            tags: mercurylayer/mercury-server:${{ env.COMMIT_HASH }}
        -
          name: Build and push for token-server-v2
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./token-server-v2/Dockerfile
            push: true
            tags: mercurylayer/token-server-v2:${{ env.COMMIT_HASH }}
        -
          name: Build and push for keylist-cronjob
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./keylistCron/Dockerfile
            push: true
            tags: mercurylayer/keylist-cronjob:${{ env.COMMIT_HASH }}
